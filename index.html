<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BALA .</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container-signup">
      <div class="container-1">
        <header class="cabecalho">
          <img src="./img/logo.svg" alt="Logo escrito BALA ." class="logo" />
        </header>
        <h1>Welcome. Start your journey now with our management system!</h1>
      </div>
      <main class="container-main">
        <section class="secao-1">
          <div class="container-login">
            <h3>Create an account</h3>
            <form action="submit" class="form-signup">
              <label for="email">Email</label>
              <input type="text" />
                <label for="password">Password</label>
                <input type="password" />
                <img src="./img/eye.svg" alt="eyes" />
            </form>
            <button class="btn-signup">Create account</button>
            <div>
              <img src="" alt="" />
              <button class="btn-google">Continue with Google</button>
            </div>
            <span>Already Have An Account? <a href="#">Log in</a></span>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
